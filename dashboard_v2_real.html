<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ETF Nowcasting — Dashboard</title>
<meta name="viewport" content="width=1280">
<style>
/* ─────────────────────────────────────────────────────────────────
   ETF Nowcasting — Design System
   colors_and_type.css
   Owns: type, color, spacing, radii, shadow, motion tokens
   ───────────────────────────────────────────────────────────────── */

/* Fonts — Google Fonts substitution (see README; flagged for user).
   Self-hosting would replace this @import with @font-face from /fonts. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* ─────────── Brand ─────────── */
  /* Sampled from the BITAmin "B" logo (burgundy → orange gradient). */
  --brand-burgundy-900: #5C1717;
  --brand-burgundy-800: #791C1C;
  --brand-burgundy-700: #9A1F1F;   /* primary */
  --brand-burgundy-600: #B53431;
  --brand-orange-500:   #D85A2F;
  --brand-orange-400:   #E07A3C;
  --brand-amber-300:    #ECA050;
  --brand-gradient:     linear-gradient(160deg, var(--brand-burgundy-700) 0%, var(--brand-orange-500) 75%, var(--brand-amber-300) 100%);

  /* ─────────── Neutrals — dark surface (default for product UI) ─────────── */
  --ink-1000: #06080A;   /* paper-deep */
  --ink-950:  #0B0E12;
  --ink-900:  #0F1216;   /* dashboard bg */
  --ink-850:  #14181E;   /* card */
  --ink-800:  #1A1F26;   /* card hover / row stripe */
  --ink-700:  #232932;   /* divider strong */
  --ink-600:  #2E3540;
  --ink-500:  #3D4654;
  --ink-400:  #545E6E;
  --ink-300:  #7C8696;
  --ink-200:  #A3ACBA;
  --ink-100:  #C9CFD8;
  --ink-50:   #E6E9EF;
  --ink-25:   #F2F4F7;

  /* ─────────── Neutrals — light surface (marketing / docs) ─────────── */
  --paper-50:  #FBF9F5;
  --paper-100: #F7F4EE;   /* page bg */
  --paper-200: #F0EBE1;
  --paper-300: #E4DDD0;

  /* ─────────── Semantic foreground / background (dark default) ─────────── */
  --bg-base:     var(--ink-900);
  --bg-elev-1:   var(--ink-850);
  --bg-elev-2:   var(--ink-800);
  --bg-elev-3:   var(--ink-700);
  --bg-inverse:  var(--paper-100);

  --fg-strong:   #FFFFFF;
  --fg-default:  var(--ink-50);
  --fg-muted:    var(--ink-200);
  --fg-subtle:   var(--ink-300);
  --fg-disabled: var(--ink-400);
  --fg-inverse:  var(--ink-900);

  --border-hairline:  rgba(255, 255, 255, 0.08);
  --border-default:   rgba(255, 255, 255, 0.14);
  --border-strong:    rgba(255, 255, 255, 0.24);

  /* ─────────── Market — Korean convention (red up, blue down) ─────────── */
  --gain-700:   #A0211D;
  --gain-600:   #C3292A;
  --gain-500:   #D6342F;    /* up */
  --gain-400:   #E45A55;
  --gain-100:   rgba(214, 52, 47, 0.16);

  --loss-700:   #14458F;
  --loss-600:   #1B5BC7;
  --loss-500:   #1F6FEB;    /* down */
  --loss-400:   #4F8DF0;
  --loss-100:   rgba(31, 111, 235, 0.16);

  --flat-500:   #7C8696;
  --flat-100:   rgba(124, 134, 150, 0.14);

  /* ─────────── Semantic — status ─────────── */
  --color-positive: var(--gain-500);
  --color-negative: var(--loss-500);
  --color-success:  #4FB069;       /* rule pass · system green */
  --color-warn:     #E08A1E;
  --color-info:     #4FA8E0;
  --color-focus:    #56D2E0;

  /* ─────────── Data palette — 6 equally-luminous stops for chart series ─────────── */
  --data-1: #C2553F;   /* terracotta */
  --data-2: #C99146;   /* ochre */
  --data-3: #6E9460;   /* sage */
  --data-4: #3F8A8C;   /* teal */
  --data-5: #4A5D7E;   /* slate */
  --data-6: #8A5D85;   /* plum */

  /* ─────────── Sector palette (maps to codebase SECTOR_COL values) ─────────── */
  --sector-semiconductor:    var(--data-1);   /* Semiconductor / 반도체 */
  --sector-secondary-battery: var(--data-2);  /* SecondaryBattery / 2차전지 */
  --sector-bigtech:          var(--data-6);   /* BigTech */
  --sector-india:            var(--data-2);
  --sector-china:            var(--gain-600);
  --sector-domestic-core:    var(--data-3);
  --sector-global-macro:     var(--data-4);
  --sector-defensive:        var(--data-5);
  --sector-real-assets:      var(--data-2);
  --sector-rate-cash:        var(--ink-300);
  --sector-sovereign-kr:     var(--data-5);
  --sector-sovereign-us:     var(--data-4);

  /* ─────────── Type families ─────────── */
  --font-sans:    'Inter', 'IBM Plex Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Inter', 'IBM Plex Sans KR', system-ui, sans-serif;
  --font-kr:      'IBM Plex Sans KR', 'Inter', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ─────────── Type scale (px) ─────────── */
  --fs-10: 10px;
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-18: 18px;
  --fs-22: 22px;
  --fs-28: 28px;
  --fs-36: 36px;
  --fs-48: 48px;
  --fs-64: 64px;

  /* ─────────── Line heights ─────────── */
  --lh-tight:   1.1;
  --lh-snug:    1.25;
  --lh-normal:  1.45;
  --lh-relaxed: 1.6;

  /* ─────────── Spacing (4 px base) ─────────── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;
  --sp-20: 80px;
  --sp-24: 96px;

  /* ─────────── Radii ─────────── */
  --radius-2:    2px;
  --radius-4:    4px;
  --radius-8:    8px;
  --radius-12:   12px;
  --radius-16:   16px;
  --radius-pill: 999px;

  /* ─────────── Shadow ─────────── */
  --shadow-0: 0 0 0 1px var(--border-hairline);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.30), 0 1px 1px rgba(0,0,0,0.20);
  --shadow-2: 0 8px 24px rgba(0,0,0,0.40), 0 2px 4px rgba(0,0,0,0.20);
  --shadow-3: 0 24px 64px rgba(0,0,0,0.55), 0 8px 16px rgba(0,0,0,0.30);
  --shadow-inset: inset 0 1px 0 rgba(0,0,0,0.25);

  /* ─────────── Motion ─────────── */
  --ease-out:   cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in:    cubic-bezier(0.4, 0.0, 1, 1);
  --ease-spring: cubic-bezier(0.34, 1.2, 0.64, 1);

  --dur-fast:   120ms;
  --dur-base:   200ms;
  --dur-slow:   320ms;
  --dur-number: 600ms;

  /* ─────────── Layout ─────────── */
  --sidebar-w:     240px;
  --topbar-h:      56px;
  --regime-bar-h:  40px;
  --container-max: 1280px;
}

/* ─────────── Light theme override (apply [data-theme="light"] on root) ─────────── */
[data-theme="light"] {
  --bg-base:    var(--paper-100);
  --bg-elev-1:  var(--paper-50);
  --bg-elev-2:  #FFFFFF;
  --bg-elev-3:  #FFFFFF;
  --bg-inverse: var(--ink-900);

  --fg-strong:   var(--ink-1000);
  --fg-default:  var(--ink-900);
  --fg-muted:    var(--ink-500);
  --fg-subtle:   var(--ink-400);
  --fg-disabled: var(--ink-300);
  --fg-inverse:  #FFFFFF;

  --border-hairline: rgba(15, 18, 22, 0.08);
  --border-default:  rgba(15, 18, 22, 0.14);
  --border-strong:   rgba(15, 18, 22, 0.22);

  --shadow-0: 0 0 0 1px var(--border-hairline);
  --shadow-1: 0 1px 2px rgba(15,18,22,0.06), 0 1px 1px rgba(15,18,22,0.04);
  --shadow-2: 0 8px 24px rgba(15,18,22,0.10), 0 2px 4px rgba(15,18,22,0.06);
  --shadow-3: 0 24px 64px rgba(15,18,22,0.18), 0 8px 16px rgba(15,18,22,0.10);
}

/* ─────────────────────────────────────────────────────────────────
   Base + semantic class shortcuts
   ───────────────────────────────────────────────────────────────── */

html, body {
  background: var(--bg-base);
  color: var(--fg-default);
  font-family: var(--font-sans);
  font-size: var(--fs-14);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'cv11' 1, 'ss01' 1;
}

/* Display + headings */
.t-display-xl,
h1.display {
  font-family: var(--font-display);
  font-size: var(--fs-64);
  line-height: var(--lh-tight);
  letter-spacing: -0.025em;
  font-weight: 700;
  color: var(--fg-strong);
}
.t-display-lg {
  font-size: var(--fs-48);
  line-height: var(--lh-tight);
  letter-spacing: -0.02em;
  font-weight: 700;
  color: var(--fg-strong);
}
.t-display-md, h1 {
  font-size: var(--fs-36);
  line-height: var(--lh-snug);
  letter-spacing: -0.018em;
  font-weight: 700;
  color: var(--fg-strong);
}
h2, .t-h2 {
  font-size: var(--fs-28);
  line-height: var(--lh-snug);
  letter-spacing: -0.014em;
  font-weight: 700;
  color: var(--fg-strong);
}
h3, .t-h3 {
  font-size: var(--fs-22);
  line-height: var(--lh-snug);
  letter-spacing: -0.01em;
  font-weight: 600;
  color: var(--fg-strong);
}
h4, .t-h4 {
  font-size: var(--fs-18);
  line-height: var(--lh-snug);
  font-weight: 600;
  color: var(--fg-strong);
}
.t-body, p {
  font-size: var(--fs-14);
  line-height: var(--lh-normal);
  color: var(--fg-default);
}
.t-body-lg {
  font-size: var(--fs-16);
  line-height: var(--lh-relaxed);
  color: var(--fg-default);
}
.t-body-sm {
  font-size: var(--fs-13);
  line-height: var(--lh-normal);
  color: var(--fg-muted);
}
.t-caption {
  font-size: var(--fs-12);
  line-height: var(--lh-normal);
  color: var(--fg-muted);
}
.t-micro {
  font-size: var(--fs-10);
  line-height: var(--lh-normal);
  color: var(--fg-subtle);
}

/* Eyebrow / ALL-CAPS tracked label */
.t-eyebrow {
  font-family: var(--font-sans);
  font-size: var(--fs-11);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-muted);
}

/* Numeric display — hero stat */
.t-num-display {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--fs-36);
  letter-spacing: -0.02em;
  font-feature-settings: 'tnum' 1, 'ss01' 1, 'cv11' 1;
  color: var(--fg-strong);
}
.t-num-lg {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--fs-22);
  font-feature-settings: 'tnum' 1, 'ss01' 1;
  letter-spacing: -0.01em;
  color: var(--fg-strong);
}

/* Mono — tickers, table figures */
.t-mono,
.mono {
  font-family: var(--font-mono);
  font-feature-settings: 'tnum' 1, 'zero' 1;
}
.t-ticker {
  font-family: var(--font-mono);
  font-size: var(--fs-12);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--fg-default);
}

/* Korean override class */
.kr {
  font-family: var(--font-kr);
}

/* Code blocks */
code, pre {
  font-family: var(--font-mono);
  font-size: var(--fs-13);
  background: var(--bg-elev-2);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-4);
  padding: 1px 6px;
}

/* Up / down semantic colors */
.fg-up,    .gain { color: var(--color-positive); }
.fg-down,  .loss { color: var(--color-negative); }
.fg-flat        { color: var(--flat-500); }
.bg-up   { background: var(--gain-100); color: var(--color-positive); }
.bg-down { background: var(--loss-100); color: var(--color-negative); }
.bg-flat { background: var(--flat-100); color: var(--flat-500); }

/* Utility surfaces */
.surface       { background: var(--bg-base); color: var(--fg-default); }
.surface-card  { background: var(--bg-elev-1); border: 1px solid var(--border-hairline); border-radius: var(--radius-12); }
.surface-deep  { background: var(--bg-elev-2); }

/* Focus ring */
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
  border-radius: var(--radius-4);
}

/* ETF Nowcasting — dashboard chrome
   Owns: Shell, Sidebar, Topbar, Card, Table, Buttons, Segmented, Search */

html, body { margin: 0; padding: 0; min-width: 1280px; }
body { font-family: var(--font-sans); }

/* ── Shell ─────────────────────────────────────────────────────── */
.etfn-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
  background: var(--bg-base);
  color: var(--fg-default);
}

.etfn-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.etfn-content {
  padding: 24px 32px 64px;
  flex: 1;
  min-width: 0;
}

/* ── Sidebar ───────────────────────────────────────────────────── */
.etfn-sidebar {
  border-right: 1px solid var(--border-hairline);
  background: var(--bg-elev-1);
  display: flex;
  flex-direction: column;
  padding: 18px 0 12px;
  position: sticky; top: 0; height: 100vh;
}
.etfn-sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px 22px;
  border-bottom: 1px solid var(--border-hairline);
  margin-bottom: 12px;
}
.etfn-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: var(--fg-muted);
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast);
}
.etfn-nav-item:hover { background: var(--bg-elev-2); color: var(--fg-default); }
.etfn-nav-item.is-active {
  background: color-mix(in oklab, var(--brand-burgundy-700) 18%, transparent);
  color: var(--fg-strong);
  position: relative;
}
.etfn-nav-item.is-active::before {
  content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px;
  width: 2px; border-radius: 2px;
  background: var(--brand-orange-500);
}
.etfn-rebal-card {
  background: var(--bg-elev-2);
  border: 1px solid var(--border-hairline);
  border-radius: 8px;
  padding: 10px 12px;
}

/* ── Topbar ────────────────────────────────────────────────────── */
.etfn-topbar {
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border-hairline);
  background: var(--bg-base);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 12px;
  position: sticky; top: 40px; z-index: 5;
}
.etfn-search {
  display: flex; align-items: center; gap: 8px;
  width: 360px; height: 32px;
  background: var(--bg-elev-1);
  border: 1px solid var(--border-hairline);
  border-radius: 8px;
  padding: 0 10px;
  color: var(--fg-muted);
}
.etfn-search input {
  flex: 1; background: transparent; border: 0; outline: 0;
  color: var(--fg-default); font-size: 13px; font-family: var(--font-sans);
}
.etfn-search input::placeholder { color: var(--fg-subtle); }
.etfn-search kbd {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--fg-subtle);
  padding: 2px 5px; border-radius: 4px;
  border: 1px solid var(--border-hairline);
  background: var(--bg-elev-2);
}

/* ── Buttons ───────────────────────────────────────────────────── */
.etfn-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: var(--bg-elev-1);
  color: var(--fg-default);
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast);
  white-space: nowrap;
  position: relative;
}
.etfn-btn:hover { background: var(--bg-elev-2); }
.etfn-btn--primary {
  background: var(--brand-burgundy-700); color: #fff;
}
.etfn-btn--primary:hover { background: var(--brand-burgundy-600); }
.etfn-btn--ghost {
  background: transparent; color: var(--fg-muted);
}
.etfn-btn--ghost:hover { background: var(--bg-elev-2); color: var(--fg-default); }
.etfn-bell-dot {
  position: absolute; top: 4px; right: 4px;
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--brand-orange-500);
  box-shadow: 0 0 0 2px var(--bg-base);
}

/* ── Segmented control ────────────────────────────────────────── */
.etfn-seg {
  display: inline-flex; padding: 3px;
  background: var(--bg-elev-1);
  border: 1px solid var(--border-hairline);
  border-radius: 8px;
}
.etfn-seg button {
  height: 24px; padding: 0 12px;
  border: 0; background: transparent;
  color: var(--fg-muted); font-size: 12px; font-weight: 500;
  border-radius: 6px; cursor: pointer;
  transition: background var(--dur-fast), color var(--dur-fast);
  font-family: var(--font-sans);
}
.etfn-seg button:hover { color: var(--fg-default); }
.etfn-seg button.is-active {
  background: var(--brand-burgundy-700); color: #fff;
}
.etfn-seg--sm button { height: 22px; padding: 0 10px; font-size: 11px; }

/* ── Card ──────────────────────────────────────────────────────── */
.etfn-card {
  background: var(--bg-elev-1);
  border: 1px solid var(--border-hairline);
  border-radius: 12px;
  box-shadow: var(--shadow-1);
  min-width: 0;
}
.etfn-card-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.etfn-card-title {
  font-size: 14px; font-weight: 600; color: var(--fg-strong);
  letter-spacing: -0.005em;
}
.etfn-card-meta {
  font-size: 12px; color: var(--fg-muted);
  font-family: var(--font-mono);
}

/* ── Table ─────────────────────────────────────────────────────── */
.etfn-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.etfn-table th {
  text-align: left; font-weight: 600;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg-muted);
  padding: 8px 10px 8px;
  border-bottom: 1px solid var(--border-hairline);
  background: var(--bg-elev-1);
  position: sticky; top: 0;
  white-space: nowrap;
}
.etfn-table th.r, .etfn-table td.r { text-align: right; }
.etfn-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-hairline);
  vertical-align: middle;
}
.etfn-table tbody tr {
  transition: background var(--dur-fast) var(--ease-out);
}
.etfn-table tbody tr:hover td { background: var(--bg-elev-2); }
.etfn-table tbody tr:last-child td { border-bottom: 0; }

/* ── Hover row helper ──────────────────────────────────────────── */
.etfn-row-hover { transition: background var(--dur-fast); }
.etfn-row-hover:hover { background: var(--bg-elev-2); }

/* ── First-paint number tick animation ─────────────────────────── */
.etfn-content {
  animation: etfn-fade-in 300ms var(--ease-out);
}
@keyframes etfn-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

</style>
</head>
<body data-screen-label="ETF Nowcasting Dashboard">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script>// ETF Nowcasting — REAL data · 2025-05-19 기준
// 출처: src_tft_port_regime/outputs/portfolio/2025-05-19/
//       src_tft_port_regime/outputs/portfolio/backtest_regime/backtest_returns.csv

window.ETFN_DATA = (function () {
  const SECTORS = {
    Semiconductor:    { kr: '반도체',      glyph: '반',   color: 'var(--data-1)' },
    SecondaryBattery: { kr: '2차전지',     glyph: '2차',  color: 'var(--data-2)' },

  <script type="text/babel">// Atoms — Card, Pill, Badge, SectorGlyph, IssuerBadge, NumberFmt, ProgressBar, Sparkline
const { useMemo } = React;

const Card = ({ title, meta, action, children, padding = 20, style }) => (
  <div className="etfn-card" style={{ padding: 0, ...style }}>
    {(title || meta || action) && (
      <div className="etfn-card-hd" style={{ padding: `14px ${padding}px 10px` }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, minWidth: 0 }}>
          {title && <div className="etfn-card-title">{title}</div>}
          {meta && <div className="etfn-card-meta">{meta}</div>}
        </div>
        {action}
      </div>
    )}
    <div style={{ padding: `0 ${padding}px ${padding - 4}px` }}>{children}</div>
  </div>
);

const Pill = ({ children, tone = 'neutral', dot = false, style }) => {
  const tones = {
    neutral: { bg: 'var(--ink-700)', fg: 'var(--fg-default)', d: 'var(--fg-muted)' },
    primary: { bg: 'var(--brand-burgundy-700)', fg: '#fff', d: '#fff' },
    up:      { bg: 'var(--gain-100)', fg: 'var(--gain-500)', d: 'var(--gain-500)' },
    down:    { bg: 'var(--loss-100)', fg: 'var(--loss-500)', d: 'var(--loss-500)' },
    success: { bg: 'color-mix(in oklab, var(--color-success) 18%, transparent)', fg: 'var(--color-success)', d: 'var(--color-success)' },
    warn:    { bg: 'color-mix(in oklab, var(--color-warn) 18%, transparent)', fg: 'var(--color-warn)', d: 'var(--color-warn)' },
    info:    { bg: 'color-mix(in oklab, var(--color-info) 18%, transparent)', fg: 'var(--color-info)', d: 'var(--color-info)' },
    outline: { bg: 'transparent', fg: 'var(--fg-default)', d: 'var(--fg-muted)', border: 'var(--border-default)' },
  };
  const t = tones[tone] || tones.neutral;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      padding: '3px 9px', borderRadius: 999,
      fontSize: 11, fontWeight: 600, letterSpacing: '0.02em',
      background: t.bg, color: t.fg, border: `1px solid ${t.border || 'transparent'}`,
      ...style,
    }}>
      {dot && <span style={{ width: 6, height: 6, borderRadius: 999, background: t.d }}/>}
      {children}
    </span>
  );
};

const IssuerBadge = ({ issuer }) => (
  <span style={{
    display: 'inline-flex', padding: '2px 5px', borderRadius: 4,
    border: '1px solid var(--border-default)',
    fontFamily: 'var(--font-mono)', fontSize: 9, fontWeight: 600,
    letterSpacing: '0.06em', color: 'var(--fg-muted)',
    textTransform: 'uppercase',
  }}>{issuer}</span>
);

const SectorGlyph = ({ sec, size = 22 }) => {
  const meta = window.ETFN_DATA.SECTORS[sec] || { glyph: '·', color: 'var(--fg-muted)' };
  const px = `${size}px`;
  return (
    <span style={{
      width: px, height: px,
      borderRadius: Math.max(3, size / 4.4),
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'var(--font-kr)', fontWeight: 700,
      fontSize: size <= 22 ? 9 : 11,
      background: `color-mix(in oklab, ${meta.color} 18%, transparent)`,
      color: meta.color,
      flexShrink: 0,
    }}>{meta.glyph}</span>
  );
};

// Number formatting — Korean convention: sign-leading, % suffix, mono.
const fmtPct = (v, opts = {}) => {
  const { signed = true, digits = 2 } = opts;
  const sign = v > 0 ? '+' : v < 0 ? '−' : '';
  return `${signed ? sign : ''}${Math.abs(v * 100).toFixed(digits)}%`;
};
const fmtKRW = (v) => '₩ ' + (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v.toLocaleString());

const NumChange = ({ value, digits = 2, showArrow = true, size = 12 }) => {
  const cls = value > 0 ? 'fg-up' : value < 0 ? 'fg-down' : 'fg-flat';
  return (
    <span className={`mono ${cls}`} style={{ fontSize: size, fontFeatureSettings: "'tnum' 1, 'ss01' 1", display: 'inline-flex', alignItems: 'center', gap: 4 }}>
      {showArrow && value !== 0 && (value > 0 ? <TriUp/> : <TriDown/>)}
      {fmtPct(value, { digits })}
    </span>
  );
};

const ProgressBar = ({ value, max = 1, color = 'var(--brand-burgundy-700)', width = 60, height = 6 }) => {
  const pct = Math.min(100, Math.max(0, (value / max) * 100));
  return (
    <span style={{
      width, height, borderRadius: height / 2,
      background: 'var(--ink-700)', overflow: 'hidden', display: 'inline-block',
    }}>
      <span style={{ display: 'block', height: '100%', width: `${pct}%`, background: color }}/>
    </span>
  );
};

const Sparkline = ({ data, color = 'var(--data-1)', width = 120, height = 28, fill = false }) => {
  const path = useMemo(() => {
    if (!data || !data.length) return '';
    const mn = Math.min(...data), mx = Math.max(...data);
    const r = (mx - mn) || 1;
    const step = width / (data.length - 1 || 1);
    return data.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${(height - ((v - mn) / r) * (height - 2) - 1).toFixed(1)}`).join(' ');
  }, [data, width, height]);
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: 'block' }}>
      {fill && <path d={`${path} L${width},${height} L0,${height} Z`} fill={color} fillOpacity="0.15"/>}
      <path d={path} stroke={color} strokeWidth="1.5" fill="none" strokeLinejoin="round"/>
    </svg>
  );
};

// Hero stat card with optional sparkline / footer
const StatCard = ({ label, value, valueTone = 'default', sparkData, sparkColor, footer }) => {
  const tone = valueTone === 'up' ? 'var(--gain-500)' : valueTone === 'down' ? 'var(--loss-500)' : 'var(--fg-strong)';
  return (
    <div className="etfn-card" style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div className="t-eyebrow">{label}</div>
      <div style={{
        fontFamily: 'var(--font-sans)', fontWeight: 600,
        fontSize: 28, letterSpacing: '-0.02em',
        fontFeatureSettings: "'tnum' 1, 'ss01' 1",
        color: tone, lineHeight: 1.15,
      }}>{value}</div>
      {sparkData && <Sparkline data={sparkData} color={sparkColor} width={220} height={28}/>}
      {footer && <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--fg-muted)' }}>{footer}</div>}
    </div>
  );
};

Object.assign(window, { Card, Pill, IssuerBadge, SectorGlyph, NumChange, ProgressBar, Sparkline, StatCard, fmtPct, fmtKRW });
</script>

// Allocation donut + legend
const AllocationPie = ({ holdings, size = 160 }) => {
  const total = holdings.reduce((s, h) => s + h.w, 0) || 1;
  const radius = size / 2 - 8;
  const cx = size / 2, cy = size / 2;
  let acc = 0;
  const segs = holdings.map(h => {
    const start = (acc / total) * Math.PI * 2 - Math.PI / 2;
    acc += h.w;
    const end = (acc / total) * Math.PI * 2 - Math.PI / 2;
    const x1 = cx + Math.cos(start) * radius;
    const y1 = cy + Math.sin(start) * radius;
    const x2 = cx + Math.cos(end) * radius;
    const y2 = cy + Math.sin(end) * radius;
    const large = end - start > Math.PI ? 1 : 0;
    const color = (window.ETFN_DATA.SECTORS[h.sec] || {}).color || 'var(--ink-300)';
    return { d: `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2} Z`, color, h };
  });

  return (
    <div style={{ display: 'flex', gap: 18, alignItems: 'center' }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {segs.map((s, i) => (
          <path key={i} d={s.d} fill={s.color} stroke="var(--bg-elev-1)" strokeWidth="1.5"/>
        ))}
        <circle cx={cx} cy={cy} r={radius * 0.55} fill="var(--bg-elev-1)"/>
        <text x={cx} y={cy - 4} textAnchor="middle" fontFamily="var(--font-mono)" fontSize="11" fill="var(--fg-subtle)">holdings</text>
        <text x={cx} y={cy + 14} textAnchor="middle" fontFamily="var(--font-sans)" fontSize="22" fontWeight="700" fill="var(--fg-strong)">{holdings.length}</text>
      </svg>
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
        {(() => {
          // Aggregate by sector for legend tidiness
          const bySec = {};
          holdings.forEach(h => { bySec[h.sec] = (bySec[h.sec] || 0) + h.w; });
          return Object.entries(bySec).sort((a, b) => b[1] - a[1]).map(([sec, w]) => {
            const meta = window.ETFN_DATA.SECTORS[sec] || {};
            return (
              <div key={sec} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: meta.color }}/>
                <span style={{ flex: 1, color: 'var(--fg-default)' }}>{sec}</span>
                <span className="mono" style={{ color: 'var(--fg-muted)' }}>{(w * 100).toFixed(1)}%</span>
              </div>
            );
          });
        })()}
      </div>
    </div>
  );
};

Object.assign(window, { HoldingsTable, AllocationPie });
</script>
  <script type="text/babel">// Charts — QuantileFan, BacktestChart, SentimentChart, SectorBarChart

const QuantileFan = ({ etf, width = 600, height = 220 }) => {
  const W = width, H = height, PADL = 44, PADR = 16, PADT = 24, PADB = 28;
  const ix = (i, n) => PADL + (i / (n - 1)) * (W - PADL - PADR);
  // Generate a 24-day forward path biased toward the etf's q10/q50/q90
  const days = 24, nowIdx = 18;
  function rnd(s, i) { const x = Math.sin(s * 999 + i * 7) * 10000; return x - Math.floor(x); }
  const seed = etf.tk.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const q50series = Array.from({ length: days }, (_, i) => {
    const t = (i - nowIdx) / (days - nowIdx);
    return t < 0 ? etf.q50 * t * -0.4 + (rnd(seed, i) - 0.5) * 0.004 : etf.q50 * t + (rnd(seed, i) - 0.5) * 0.002;
  });
  const q10series = q50series.map((v, i) => v + (etf.q10 - etf.q50) * Math.max(0, (i - nowIdx) / (days - nowIdx)));
  const q90series = q50series.map((v, i) => v + (etf.q90 - etf.q50) * Math.max(0, (i - nowIdx) / (days - nowIdx)));
  const realised = q50series.slice(0, nowIdx + 1).map((v, i) => v + (rnd(seed * 3, i) - 0.5) * 0.008);

  const mn = Math.min(etf.q10, ...realised) - 0.005;
  const mx = Math.max(etf.q90, ...realised) + 0.005;
  const iy = v => PADT + (1 - (v - mn) / (mx - mn)) * (H - PADT - PADB);

  const polyline = (vals) => vals.map((v, i) => `${ix(i, days)},${iy(v).toFixed(1)}`).join(' ');
  const fanPath = (() => {
    const top = q90series.map((v, i) => `${ix(i, days)},${iy(v).toFixed(1)}`).join(' L ');
    const bot = [...q10series].reverse().map((v, i) => `${ix(days - 1 - i, days)},${iy(v).toFixed(1)}`).join(' L ');
    return `M ${top} L ${bot} Z`;
  })();
  const color = (window.ETFN_DATA.SECTORS[etf.sec] || {}).color || 'var(--data-1)';

  // y-axis ticks
  const ticks = [mx, (mx + mn) / 2, mn].map(v => ({ v, y: iy(v) }));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none">
      <g stroke="rgba(255,255,255,0.05)">
        {ticks.map((t, i) => <line key={i} x1={PADL} y1={t.y} x2={W - PADR} y2={t.y}/>)}
      </g>
      <g fontFamily="var(--font-mono)" fontSize="10" fill="var(--fg-subtle)">
        {ticks.map((t, i) => <text key={i} x={PADL - 6} y={t.y + 3} textAnchor="end">{fmtPct(t.v, { digits: 1 })}</text>)}
      </g>
      <path d={fanPath} fill={color} fillOpacity="0.18"/>
      <polyline fill="none" stroke={color} strokeWidth="1.5" points={polyline(q50series)}/>
      <polyline fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="1" strokeDasharray="2 3" points={polyline(realised)}/>
      <line x1={ix(nowIdx, days)} y1={PADT - 4} x2={ix(nowIdx, days)} y2={H - PADB} stroke="rgba(255,255,255,0.30)" strokeWidth="1" strokeDasharray="2 3"/>
      <text x={ix(nowIdx, days) + 4} y={PADT + 4} fontFamily="var(--font-mono)" fontSize="10" fill="rgba(255,255,255,0.65)">now</text>
      {/* x-axis */}
      <g fontFamily="var(--font-mono)" fontSize="10" fill="var(--fg-subtle)">
        <text x={PADL} y={H - 8}>t−18d</text>
        <text x={ix(nowIdx, days)} y={H - 8} textAnchor="middle">t0</text>
        <text x={W - PADR} y={H - 8} textAnchor="end">t+5d</text>
      </g>
      {/* legend */}
      <g fontFamily="var(--font-mono)" fontSize="10" fill="rgba(255,255,255,0.78)">
        <rect x={PADL} y={6} width="10" height="6" fill={color} fillOpacity="0.4"/>
        <text x={PADL + 14} y={12}>q10–q90</text>
        <line x1={PADL + 80} y1={9} x2={PADL + 92} y2={9} stroke={color} strokeWidth="1.5"/>
        <text x={PADL + 96} y={12}>q50</text>
        <line x1={PADL + 130} y1={9} x2={PADL + 142} y2={9} stroke="rgba(255,255,255,0.85)" strokeWidth="1" strokeDasharray="2 3"/>
        <text x={PADL + 146} y={12}>realised</text>
      </g>
    </svg>
  );
};

const BacktestChart = ({ data, width = 600, height = 200 }) => {
  const W = width, H = height, PADL = 44, PADR = 16, PADT = 20, PADB = 24;
  const all = data.flatMap(d => [d.conservative, d.regime, d.aggressive, d.equal_weight, d.kospi, d.sp500]);
  const mn = Math.min(...all), mx = Math.max(...all);
  const range = mx - mn || 1e-9;
  const ix = i => PADL + (i / Math.max(data.length - 1, 1)) * (W - PADL - PADR);
  const iy = v => PADT + (1 - (v - mn) / range) * (H - PADT - PADB);
  const make = (key) => data.map((d, i) => `${ix(i).toFixed(1)},${iy(d[key]).toFixed(1)}`).join(' ');

  const ticks = [mx, (mx * 2 + mn) / 3, (mx + mn * 2) / 3, mn].map(v => ({ v, y: iy(v) }));
  const first = data[0]?.date?.slice(0, 7) ?? '';
  const mid   = data[Math.floor(data.length / 2)]?.date?.slice(0, 7) ?? '';
  const last  = data[data.length - 1]?.date?.slice(0, 7) ?? '';

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none">
      <g stroke="rgba(255,255,255,0.05)">
        {ticks.map((t, i) => <line key={i} x1={PADL} y1={t.y} x2={W - PADR} y2={t.y}/>)}
      </g>
      <g fontFamily="var(--font-mono)" fontSize="10" fill="var(--fg-subtle)">
        {ticks.map((t, i) => <text key={i} x={PADL - 6} y={t.y + 3} textAnchor="end">{((t.v - 1) * 100).toFixed(0)}%</text>)}
        <text x={PADL} y={H - 6}>{first}</text>
        <text x={(PADL + W - PADR) / 2} y={H - 6} textAnchor="middle">{mid}</text>
        <text x={W - PADR} y={H - 6} textAnchor="end">{last}</text>
      </g>
      {/* 참고 지수 (mock · 시각 용도) */}
      <polyline fill="none" stroke="var(--ink-300)" strokeWidth="1" strokeDasharray="2 3" points={make('kospi')}/>
      <polyline fill="none" stroke="var(--data-4)" strokeWidth="1" strokeDasharray="2 3" points={make('sp500')}/>
      {/* 전략 곡선 */}
      <polyline fill="none" stroke="var(--data-5)" strokeWidth="1" strokeDasharray="3 2" points={make('aggressive')}/>
      <polyline fill="none" stroke="var(--data-3)" strokeWidth="1" strokeDasharray="3 2" points={make('equal_weight')}/>
      <polyline fill="none" stroke="var(--data-1)" strokeWidth="1.5" points={make('conservative')}/>
      <polyline fill="none" stroke="var(--brand-orange-500)" strokeWidth="1.8" points={make('regime')}/>
      <g fontFamily="var(--font-mono)" fontSize="9">
        <rect x={PADL} y={4} width="10" height="3" fill="var(--brand-orange-500)"/>
        <text x={PADL + 14} y={9} fill="rgba(255,255,255,0.85)">Regime</text>
        <rect x={PADL + 62} y={4} width="10" height="3" fill="var(--data-1)"/>
        <text x={PADL + 76} y={9} fill="var(--fg-muted)">Conservative</text>
        <rect x={PADL + 172} y={4} width="10" height="3" fill="var(--data-5)"/>
        <text x={PADL + 186} y={9} fill="var(--fg-subtle)">Aggressive</text>
        <rect x={PADL + 258} y={4} width="10" height="3" fill="var(--data-3)"/>
        <text x={PADL + 272} y={9} fill="var(--fg-subtle)">EqWt</text>
        <line x1={PADL + 310} y1={6} x2={PADL + 320} y2={6} stroke="var(--data-4)" strokeWidth="1" strokeDasharray="2 3"/>
        <text x={PADL + 324} y={9} fill="var(--fg-subtle)">S&amp;P500</text>
        <line x1={PADL + 372} y1={6} x2={PADL + 382} y2={6} stroke="var(--ink-300)" strokeWidth="1" strokeDasharray="2 3"/>
        <text x={PADL + 386} y={9} fill="var(--fg-subtle)">KOSPI</text>
      </g>
    </svg>
  );
};

const SentimentChart = ({ data, width = 600, height = 110 }) => {
  const W = width, H = height, PADL = 40, PADR = 12, PADT = 10, PADB = 22;
  const all = data.flatMap(d => [d.dom, d.glb]);
  const mn = Math.min(-0.5, ...all), mx = Math.max(0.5, ...all);
  const ix = i => PADL + (i / (data.length - 1)) * (W - PADL - PADR);
  const iy = v => PADT + (1 - (v - mn) / (mx - mn)) * (H - PADT - PADB);
  const baseline = iy(0);
  // domestic — area
  const areaPath = (() => {
    const top = data.map((d, i) => `${ix(i)},${iy(d.dom).toFixed(1)}`).join(' L ');
    return `M ${top} L ${ix(data.length - 1)},${baseline} L ${ix(0)},${baseline} Z`;
  })();
  const domLine = data.map((d, i) => `${ix(i)},${iy(d.dom).toFixed(1)}`).join(' ');
  const glbLine = data.map((d, i) => `${ix(i)},${iy(d.glb).toFixed(1)}`).join(' ');

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none">
      <line x1={PADL} y1={baseline} x2={W - PADR} y2={baseline} stroke="rgba(255,255,255,0.18)" strokeWidth="1" strokeDasharray="2 3"/>
      <path d={areaPath} fill="var(--data-1)" fillOpacity="0.10"/>
      <polyline fill="none" stroke="var(--data-1)" strokeWidth="1.5" points={domLine}/>
      <polyline fill="none" stroke="var(--data-4)" strokeWidth="1" strokeDasharray="3 2" points={glbLine}/>
      <g fontFamily="var(--font-mono)" fontSize="10" fill="var(--fg-subtle)">
        <text x={PADL - 4} y={iy(0.5) + 3} textAnchor="end">+0.5</text>
        <text x={PADL - 4} y={baseline + 3} textAnchor="end">0</text>
        <text x={PADL - 4} y={iy(-0.5) + 3} textAnchor="end">−0.5</text>
        <text x={PADL} y={H - 6}>t−60d</text>
        <text x={W - PADR} y={H - 6} textAnchor="end">today</text>
      </g>
      <g fontFamily="var(--font-mono)" fontSize="10">
        <line x1={W - PADR - 130} y1={6} x2={W - PADR - 118} y2={6} stroke="var(--data-1)" strokeWidth="1.5"/>
        <text x={W - PADR - 114} y={9} fill="rgba(255,255,255,0.78)">domestic 감성</text>
        <line x1={W - PADR - 50} y1={6} x2={W - PADR - 38} y2={6} stroke="var(--data-4)" strokeWidth="1" strokeDasharray="3 2"/>
        <text x={W - PADR - 34} y={9} fill="var(--fg-subtle)">global</text>
      </g>
    </svg>
  );
};

// Sector exposure as horizontal bars
const SectorBars = ({ holdings }) => {
  const bySec = {};
  holdings.forEach(h => { bySec[h.sec] = (bySec[h.sec] || 0) + h.w; });
  const rows = Object.entries(bySec).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...rows.map(r => r[1]));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {rows.map(([sec, w]) => {
        const color = (window.ETFN_DATA.SECTORS[sec] || {}).color || 'var(--ink-300)';
        return (
          <div key={sec} style={{ display: 'grid', gridTemplateColumns: '120px 1fr 50px', alignItems: 'center', gap: 8, fontSize: 12 }}>
            <span style={{ color: 'var(--fg-default)' }}>{sec}</span>
            <span style={{ height: 6, borderRadius: 3, background: 'var(--ink-700)', overflow: 'hidden' }}>
              <span style={{ display: 'block', height: '100%', width: `${(w / max) * 100}%`, background: color }}/>
            </span>
            <span className="mono" style={{ textAlign: 'right', color: 'var(--fg-muted)' }}>{(w * 100).toFixed(1)}%</span>
          </div>
        );
      })}
    </div>
  );
};

Object.assign(window, { QuantileFan, BacktestChart, SentimentChart, SectorBars });
</script>
  <script type="text/babel">// Risk ledger — DB GAPS rule pass/fail rows

const RiskLedger = ({ rules }) => {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {rules.map(r => {
        const tone = r.status === 'pass' ? 'var(--color-success)'
                   : r.status === 'warn' ? 'var(--color-warn)'
                   : 'var(--color-negative)';
        const pct = r.op === '<='
          ? Math.min(100, (r.cur / r.lim) * 100)
          : Math.min(100, (r.cur / Math.max(r.lim, 0.0001)) * 100);
        return (
          <div key={r.id} style={{
            display: 'grid',
            gridTemplateColumns: '14px 1fr 60px 90px auto',
            alignItems: 'center', gap: 10,
            fontFamily: 'var(--font-mono)', fontSize: 12,
            padding: '4px 0',
          }}>
            <span style={{ color: tone }}>●</span>
            <span style={{ fontFamily: 'var(--font-sans)', color: 'var(--fg-default)' }} className={/[가-힣]/.test(r.label) ? 'kr' : ''}>{r.label}</span>
            <span style={{ color: 'var(--fg-strong)', textAlign: 'right' }}>{(r.cur * 100).toFixed(1)}%</span>

          </div>
        );
      })}
    </div>
  );
};

// Feature decomposition (HNAM-style additive breakdown)
const FactorDecomp = ({ factors }) => {
  // factors: [{ name, contribution (signed) }, ...]
  const max = Math.max(...factors.map(f => Math.abs(f.contribution)));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {factors.map(f => {
        const isUp = f.contribution >= 0;
        const tone = isUp ? 'var(--gain-500)' : 'var(--loss-500)';
        const w = (Math.abs(f.contribution) / max) * 100;
        return (
          <div key={f.name} style={{
            display: 'grid', gridTemplateColumns: '120px 1fr 1fr 60px',
            alignItems: 'center', gap: 8, fontSize: 12,
          }}>
            <span style={{ color: 'var(--fg-default)' }}>{f.name}</span>
            <span style={{ display: 'flex', justifyContent: 'flex-end' }}>
              {!isUp && <span style={{ height: 6, width: `${w}%`, background: tone, borderRadius: 3 }}/>}
            </span>
            <span style={{ display: 'flex' }}>
              {isUp && <span style={{ height: 6, width: `${w}%`, background: tone, borderRadius: 3 }}/>}
            </span>
            <span className="mono" style={{ color: tone, textAlign: 'right' }}>
              {f.contribution >= 0 ? '+' : '−'}{Math.abs(f.contribution * 100).toFixed(2)}%
            </span>
          </div>
        );
      })}
    </div>
  );
};

Object.assign(window, { RiskLedger, FactorDecomp });

const filterBacktest = (all, range) => {
  if (range === 'All' || range === '1Y') return all;
  const lastDate = new Date(all[all.length - 1].date);
  const cutoff = new Date(lastDate);
  if (range === '1M') cutoff.setDate(cutoff.getDate() - 30);
  else if (range === '3M') cutoff.setDate(cutoff.getDate() - 90);
  else if (range === 'YTD') { cutoff.setMonth(0); cutoff.setDate(1); }
  return all.filter(d => new Date(d.date) >= cutoff);
};

    </Card>
  );
};

Object.assign(window, { DashboardScreen, PortfolioScreen, EtfDetailScreen, BacktestScreen, SentimentScreen, EtfListScreen });
</script>
  <script type="text/babel">// App — wires Sidebar, Topbar, Regime bar + active screen + global state

const { useState } = React;

function App() {
  const [route, setRoute] = useState('dashboard');
  const [strategy, setStrategy] = useState('auto');
  const [selected, setSelected] = useState(null);
  const [pulseNumbers, setPulseNumbers] = useState(0);

  const effectiveStrategy = strategy === 'auto'
    ? window.ETFN_DATA.REGIME.mode
    : strategy;

  const regime = strategy === 'auto'
    ? window.ETFN_DATA.REGIME
    : { ...window.ETFN_DATA.REGIME, mode: strategy, reason: 'manual override' };

  const handlePick = (etf) => { setSelected(etf); setRoute('etf'); };
  const handleNav = (id) => { setRoute(id); setSelected(null); };
  const handleRebalance = () => { setPulseNumbers(p => p + 1); };
  const handleStrategy = (s) => { setStrategy(s); };

  let screen;
  if (route === 'dashboard')      screen = <DashboardScreen strategy={effectiveStrategy} onPick={handlePick} onStrategy={handleStrategy}/>;
  else if (route === 'portfolio') screen = <PortfolioScreen onPick={handlePick}/>;
  else if (route === 'etfs')      screen = <EtfListScreen onPick={handlePick}/>;
  else if (route === 'etf' && selected) screen = <EtfDetailScreen etf={selected} onBack={() => setRoute('dashboard')}/>;
  else if (route === 'backtest')  screen = <BacktestScreen/>;
  else if (route === 'sentiment') screen = <SentimentScreen/>;
  else                            screen = <DashboardScreen strategy={effectiveStrategy} onPick={handlePick} onStrategy={handleStrategy}/>;

  return (
    <div className="etfn-shell">
      <Sidebar active={route === 'etf' ? 'etfs' : route} onNav={handleNav}/>
      <main className="etfn-main">
        <RegimeBar regime={regime}/>
        <Topbar strategy={strategy} onStrategy={handleStrategy} onRebalance={handleRebalance}/>
        <div key={pulseNumbers} className="etfn-content">
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 16 }}>
            <h1 style={{ fontSize: 22, fontWeight: 600, letterSpacing: '-0.01em', margin: 0, color: 'var(--fg-strong)' }}>
              {route === 'dashboard' ? "Today's portfolio"
                : route === 'portfolio' ? 'Portfolios · compare'
                : route === 'etf' ? 'ETF detail'
                : route === 'etfs' ? 'ETF signals'
                : route === 'backtest' ? 'Backtest'
                : route === 'sentiment' ? 'News sentiment'
                : 'Dashboard'}
            </h1>
            <span className="mono" style={{ fontSize: 11, color: 'var(--fg-subtle)' }}>
              TFT v0.7 · features <code style={{ background:'transparent', border:0, padding:0 }}>price_macro_sentiment</code> · updated 09:31 KST
            </span>
          </div>
          {screen}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
